<script>
const $=s=>document.querySelector(s),K='fw_office_v1',COL=['#5b8cff','#f0883e','#a371f7','#3ecf8e','#f778ba','#e3b341','#39c5cf'];
const PRE={anthropic:{n:'Anthropic (Claude)',base:'',model:'claude-sonnet-4-6'},openai:{n:'OpenAI',base:'https://api.openai.com/v1',model:'gpt-4o-mini'},gemini:{n:'Google Gemini',base:'https://generativelanguage.googleapis.com/v1beta/openai',model:'gemini-2.0-flash'},openrouter:{n:'OpenRouter',base:'https://openrouter.ai/api/v1',model:'openai/gpt-4o-mini'},custom:{n:'Kustom (OpenAI-compatible)',base:'',model:''}};
const DEF={cfg:{prov:'anthropic',key:'',model:'claude-sonnet-4-6',base:''},boss:'Bos',view:'chat',ch:'general',
emps:[{id:'e1',name:'Dina',role:'Account Manager / Project Lead',job:'Koordinasi klien & tim, membagi tugas, merangkum laporan harian, menjaga deadline'},
{id:'e2',name:'Raka',role:'Content Strategist',job:'Riset tren, pilar konten, content plan bulanan, analisis performa'},
{id:'e3',name:'Sari',role:'Scriptwriter & Copywriter',job:'Script video pendek (hook, isi, CTA), caption, headline iklan'},
{id:'e4',name:'Bayu',role:'Social Media Scheduler',job:'Jadwal posting, jam terbaik, kalender konten, hashtag'},
{id:'e5',name:'Maya',role:'Visual Designer',job:'Brief visual, storyboard, konsep thumbnail & carousel'},
{id:'e6',name:'Lia',role:'Caption Specialist',job:'Membuat caption yang mengangkat: hook kuat di kalimat pertama, storytelling singkat, CTA jelas, hashtag relevan, selalu beri 3 variasi gaya (santai, emosional, humor), sesuai brand voice klien dan hindari pantangan'}],
msgs:{general:[{who:'Dina',text:'Halo Bos, tim feedwork.id sudah standby. Mau mulai dari mana hari ini? Bisa minta laporan, ide konten, atau jadwal posting.',t:'09:00'}]},tasks:[]};
const COLS=['Backlog','Dikerjakan','Menunggu Persetujuan','Selesai'],RK={t:0,s:1,r:2},DEFTPL={harian:'## Laporan Harian\n- Ringkasan hari ini\n- Progres per karyawan (tabel: Nama | Tugas | Status)\n- Kendala\n- Rencana besok',mingguan:'## Laporan Mingguan\n- Ringkasan capaian minggu ini\n- Konten yang tayang/dijadwalkan (tabel)\n- Tugas selesai vs tertunda\n- Insight & rekomendasi\n- Fokus minggu depan',bulanan:'## Laporan Bulanan\n- Ringkasan bulan ini\n- Capaian per klien\n- Konten terbaik & pelajaran\n- Kendala & solusi\n- Target bulan depan'};
let S=load(),M={sel:{},busy:0,talk:null,stop:0,rec:null},busy=null,draft='',pend=[],info='',pdfReady=null;
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.emps){if(!s.emps.some(e=>e.name==='Lia'))s.emps.push(DEF.emps.find(e=>e.name==='Lia'));return s}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'),escA=s=>esc(s).replace(/"/g,'&quot;');
const emp=id=>S.emps.find(e=>e.id===id),byName=n=>S.emps.find(e=>e.name===n);
const colr=n=>{const i=S.emps.findIndex(e=>e.name===n);return i<0?'#8b98a8':COL[i%COL.length]};
const av=n=>`<span class=av style="background:${colr(n)}">${esc((n||'?')[0])}</span>`;
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(t){const L=t.split('\n');let o='',i=0,list=null;const close=()=>{if(list){o+='</'+list+'>';list=null}};
while(i<L.length){const l=L[i];
if(/^\s*\|/.test(l)&&/^\s*\|?\s*:?-{2,}/.test(L[i+1]||'')){close();const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));
o+='<div class=tw><table><tr>'+cells(rows[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';continue}
let m;
if(m=l.match(/^#{1,4}\s+(.*)/)){close();o+='<h4>'+inl(m[1])+'</h4>'}
else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();o+='<ul>';list='ul'}o+='<li>'+inl(m[1])+'</li>'}
else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();o+='<ol>';list='ol'}o+='<li>'+inl(m[1])+'</li>'}
else if(!l.trim())close();else{close();o+='<p>'+inl(l)+'</p>'}
i++}close();return o}
/* ---------- LLM ---------- */
function friendly(st,d){const x=Array.isArray(d)?d[0]:d;const m=x?.error?.message||x?.error||'';
if(st>=500)return 'Server AI sedang sibuk/overload ('+st+'). Sudah dicoba ulang otomatis, coba kirim lagi sebentar lagi atau ganti model. '+(typeof m==='string'?m:'');
if(st===401||st===403)return 'API key ditolak (salah/tidak aktif). Cek lagi di ⚙ Pengaturan. '+m;
if(st===404)return 'Model tidak ditemukan. Ganti nama model di ⚙ Pengaturan. '+m;
if(st===429)return 'Kena limit atau saldo API habis. Coba lagi sebentar / isi saldo. '+m;
return 'Error API ('+st+'): '+(typeof m==='string'?m:JSON.stringify(m))}
async function llm(sy,us,mx){for(let i=0;;i++){try{return await llm1(sy,us,mx)}catch(e){if(i<2&&e.retry){await new Promise(r=>setTimeout(r,1500*(i+1)));continue}throw e}}}
async function llm1(system,user,max=1200){const c=S.cfg;if(!c.key)throw new Error('API key belum diisi. Klik ⚙ Pengaturan di kiri bawah.');
let r;try{
if(c.prov==='anthropic')r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model,max_tokens:max,system,messages:[{role:'user',content:user}]})});
else{const base=(c.base||PRE[c.prov].base).replace(/\/$/,'');if(!base)throw new Error('Base URL kosong.');
const b={model:c.model,messages:[{role:'system',content:system},{role:'user',content:user}]};b[c.prov==='openai'?'max_completion_tokens':'max_tokens']=max;
r=await fetch(base+'/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+c.key},body:JSON.stringify(b)})}
}catch(e){throw new Error('Gagal terhubung ke API ('+e.message+'). Cek internet, atau buka file ini lewat Chrome/Edge.')}
const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(friendly(r.status,d));e.retry=[429,500,502,503,504].includes(r.status);throw e}
const t=c.prov==='anthropic'?(d.content||[]).map(x=>x.text||'').join(''):(d.choices?.[0]?.message?.content||'');
if(!t.trim())throw new Error('Balasan AI kosong. Coba kirim ulang.');return t.trim()}
function sys(e,mode){const team=S.emps.map(x=>`- ${x.name} (${x.role}): ${x.job}`).join('\n');
return `Kamu ${e.name}, ${e.role} di agensi kreatif feedwork.id. Jobdesk kamu: ${e.job}.
Atasan kamu: ${S.boss} (pemilik agensi). Tim:\n${team}${bgctx()}
Gaya: bahasa Indonesia santai tapi profesional, hangat, tidak kaku, seperti rekan kerja sungguhan. Jawab tepat sesuai yang ditanyakan. Kalau di luar jobdesk, arahkan ke rekan yang tepat. Jangan menulis nama kamu di awal jawaban. Jika ada [LAMPIRAN FILE] atau [ISI LINK] di percakapan, gunakan isinya dan sebut sumbernya. Jika ada [LINK ... GAGAL], jujur bilang tidak bisa dibaca dan jangan mengarang isinya.
`+(mode==='voice'?'Ini meeting suara. Bicaralah seperti orang sungguhan ngobrol: kalimat pendek, gaya lisan natural (boleh sesekali “oke”, “nah”, “jadi”, “hmm”), maksimal 3 kalimat, tanpa markdown, tanpa emoji, tanpa tanda bintang, jangan mengulang rekan lain, bicara hanya bila relevan dengan keahlianmu.':'Format teks rapi: judul ##, poin, **tebal**, tabel markdown bila cocok. Untuk laporan pakai: Ringkasan, Progres, Kendala, Next Step. Pertanyaan singkat dijawab singkat.')}
/* ---------- chat ---------- */
const now=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function add(ch,who,text,me,err,x){(S.msgs[ch]=S.msgs[ch]||[]).push({who,text,me,err,t:now(),...x});save();render()}
const tr=(ch,n=14)=>(S.msgs[ch]||[]).slice(-n).map(m=>`${m.who}: ${m.text}${m.ctx?'\n'+m.ctx:''}`).join('\n');
const chName=ch=>ch==='general'?'grup #umum':ch==='forum'?'forum diskusi tim':ch==='meeting'?'meeting suara':'chat pribadi dengan '+S.boss;
function other(ch){return ['forum','general'].filter(c=>c!==ch&&tr(c,6)).map(c=>`\n\n[Konteks dari ${chName(c)}: kamu ikut tahu pembicaraan ini, sambungkan dan tanggapi bila relevan]\n${tr(c,6)}`).join('')}
async function reply(ch,e,extra=''){busy=e.name;render();
try{const t=await llm(sys(e),`Percakapan (${chName(ch)}):\n${tr(ch)}${other(ch)}\n\n${extra}Tulis balasan ${e.name} sekarang.`);busy=null;add(ch,e.name,t)}
catch(err){busy=null;add(ch,'Sistem',err.message,0,1);return false}return true}
async function forum(topic,x){S.ch='forum';S.view='chat';add('forum',S.boss,topic,1,0,x);
for(const e of S.emps.filter((x,i)=>i>0)){if(!await reply('forum',e,'Ini forum diskusi tim. Beri pendapat sesuai keahlianmu, tanggapi rekan sebelumnya bila relevan, maksimal 120 kata.\n'))return}
if(S.emps[0])await reply('forum',S.emps[0],'Rangkum diskusi jadi: Keputusan, lalu Tugas per orang (tabel: Siapa | Tugas | Deadline).\n')}
async function sendText(t){if(!t||busy||info)return;const ch=S.ch;const mm=t.match(/^\s*(?:ingat|catat)[:,]?\s+(.+)/i);if(mm)addMem(mm[1]);const x=await gather(t);
if(ch==='forum')return forum(t,x);
if(ch==='general'&&/diskusi|forum|rapat tim|bahas bareng/i.test(t)){add('general',S.boss,t,1,0,x);add('general',S.emps[0]?.name||'Dina',`Siap ${S.boss}, aku kumpulkan tim di #forum ya.`);return forum(t,x)}
add(ch,S.boss,t,1,0,x);let tg;
if(ch.startsWith('dm:'))tg=[emp(ch.slice(3))];else{tg=S.emps.filter(e=>new RegExp('@'+e.name+'\\b','i').test(t));if(!tg.length)tg=[S.emps[0]]}
for(const e of tg.filter(Boolean))if(!await reply(ch,e))break}
function sendBtn(){const t=draft.trim()||(pend.length?'Tolong baca lampiran ini, beri ringkasan dan saran tindak lanjut.':'');if(!t)return;draft='';sendText(t)}
function chip(t){draft='';sendText(t)}
/* ---------- lampiran & link ---------- */
function bgctx(){const c=(S.clients||[]).map(x=>`- ${x.name}: brand voice=${x.voice||'-'}; audiens=${x.aud||'-'}; pantangan=${x.taboo||'-'}`).join('\n'),m=(S.mem||[]).slice(-25).map(x=>'- '+x.text).join('\n');return (c?`\nProfil klien (WAJIB dipatuhi):\n${c}`:'')+(m?`\nMemori tim (keputusan/revisi sebelumnya, jangan ulangi kesalahan):\n${m}`:'')}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u.slice(0,30)}};
function pendRow(){return pend.length?`<div class=chips>${pend.map((a,i)=>`<span class=chip2>📎 ${esc(a.name)} <button class=x onclick="pend.splice(${i},1);render()">✕</button></span>`).join('')}</div>`:''}
function loadPdf(){return pdfReady=pdfReady||new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=async()=>{try{const w=await(await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));ok()}catch(e){no(e)}};sc.onerror=()=>no(new Error('pembaca PDF gagal dimuat, cek internet'));document.head.appendChild(sc)})}
async function readPdf(f){await loadPdf();const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=d.numPages&&t.length<40000;i++){const pg=await d.getPage(i),c=await pg.getTextContent();t+=`\n[Halaman ${i}]\n`+c.items.map(x=>x.str).join(' ')}return t.trim()}
async function pick(fl){for(const f of fl){info='Membaca '+f.name+'…';render();try{let text='';if(/\.pdf$/i.test(f.name)){text=await readPdf(f);if(!text)throw new Error('PDF ini tampaknya hasil scan (gambar), tidak ada teks yang bisa dibaca')}else text=await f.text();pend.push({name:f.name,text})}catch(e){pdfReady=null;info='';add(S.ch,'Sistem','Gagal membaca '+f.name+': '+e.message,0,1)}}info='';render()}
async function readLink(u){const h=hostOf(u);
if(/tiktok\.com/.test(h)){try{const r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(u));if(r.ok){const d=await r.json();if(d.title||d.author_name)return `TikTok oleh ${d.author_name||'?'}. Caption: ${d.title||'(kosong)'}`}}catch(e){}}
try{const r=await fetch('https://r.jina.ai/'+u,{headers:{accept:'text/plain'}});if(r.ok){const t=(await r.text()).trim();const wall=/instagram|tiktok/.test(h)&&/log ?in|sign ?up|masuk/i.test(t)&&t.length<1500;if(t.length>120&&!wall)return t.slice(0,12000)}}catch(e){}
return null}
async function gather(t){const att=[],parts=[];
for(const a of pend){att.push({n:a.name,ok:true});parts.push(`[LAMPIRAN FILE: ${a.name}]\n${a.text.slice(0,15000)}`)}pend=[];
const urls=[...new Set(t.match(/https?:\/\/[^\s)>\]]+/g)||[])].slice(0,3);
for(const u of urls){info='Membuka link '+hostOf(u)+'…';render();const r=await readLink(u).catch(()=>null);att.push({n:hostOf(u),ok:!!r});parts.push(r?`[ISI LINK ${u}]\n${r}`:`[LINK ${u}: GAGAL dibuka otomatis (situs memblokir atau butuh login). Jangan mengarang isinya; minta ${S.boss} menempel caption atau isi videonya.]`)}
info='';return {att,ctx:parts.join('\n\n').slice(0,30000)}}
/* ---------- views ---------- */
function side(){const n=(v,c,l,ic)=>`<button class="nv ${S.view===v&&(v!=='chat'||S.ch===c)?'on':''}" onclick="go('${v}','${c||''}')">${ic||''} ${l}</button>`;
$('#side').innerHTML=`<div class=brand>feedwork<span>.id</span> 🏢</div><div class=sec>Channel</div>${n('chat','general','umum','#')}${n('chat','forum','forum','#')}<div class=sec>Chat pribadi</div>${S.emps.map(e=>`<button class="nv ${S.view==='chat'&&S.ch==='dm:'+e.id?'on':''}" onclick="go('chat','dm:${e.id}')">${av(e.name)}<span>${esc(e.name)}<br><small style="color:var(--m)">${esc(e.role)}</small></span></button>`).join('')}<div class=sec>Kantor</div>${n('tasks','','Papan Tugas','📋')}${n('meet','','Ruang Meeting','🎙️')}${n('team','','Karyawan','👥')}${n('cal','','Kalender Konten','📅')}${n('klien','','Klien & Memori','🧠')}<div style="flex:1"></div><button class=nv onclick=settings()>⚙️ Pengaturan ${S.cfg.key?'':'<b style="color:var(--r)">•</b>'}</button>`}
function go(v,c){S.view=v;if(c)S.ch=c;save();$('#side').classList.remove('open');render()}
function main(){const f=document.activeElement?.id==='inp';let h='';
if(S.view==='chat')h=chatV();else if(S.view==='tasks')h=tasksV();else if(S.view==='meet')h=meetV();else if(S.view==='cal')h=calV();else if(S.view==='klien')h=klienV();else h=teamV();

function mic(){if(M.rec){M.rec.stop();return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new R();r.lang='id-ID';r.interimResults=false;

const GV=['Kore','Puck','Leda','Charon','Aoede','Fenrir','Zephyr','Orus'];let AC=null,curSrc=null;
function clean(t){return t.replace(/[*#`|_>]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,'').replace(/\s+/g,' ').trim()}
function stopVoice(){M.stop=1;speechSynthesis.cancel();try{curSrc&&curSrc.stop()}catch(e){}}
async function gSpeak(text,idx,e){const c=S.cfg,vn=(e&&e.v)||GV[idx%GV.length];
const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${c.ttsModel||'gemini-2.5-flash-preview-tts'}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':c.key},body:JSON.stringify({contents:[{parts:[{text:'Ucapkan dengan bahasa Indonesia yang natural, hangat, dan santai seperti rekan kerja yang sedang ngobrol: '+text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:vn}}}}})});
const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error('kode '+r.status);
const b64=d.candidates?.[0]?.content?.parts?.find(p=>p.inlineData)?.inlineData?.data;if(!b64)throw new Error('audio kosong');
const bin=atob(b64),n=bin.length>>1,f=new Float32Array(n);for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;f[i]=v/32768}
AC=AC||new(window.AudioContext||window.webkitAudioContext)();await AC.resume();
const buf=AC.createBuffer(1,n,24000);buf.copyToChannel(f,0);
return new Promise(res=>{const src=AC.createBufferSource();src.buffer=buf;src.connect(AC.destination);curSrc=src;src.onended=()=>res();src.start()})}
function bSpeak(text,idx){return new Promise(res=>{try{const vs=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().replace('_','-').startsWith('id'));
const sc=v=>(/natural|online|neural/i.test(v.name)?3:0)+(/google/i.test(v.name)?2:0);vs.sort((a,b)=>sc(b)-sc(a));
const parts=text.match(/[^.!?]+[.!?]*/g)||[text];let i=0;
const nx=()=>{if(i>=parts.length||M.stop)return res();const u=new SpeechSynthesisUtterance(parts[i++].trim());if(vs.length)u.voice=vs[0];u.lang='id-ID';u.pitch=.9+((idx*3)%5)*.06;u.rate=.95+((idx*2)%4)*.04;u.onend=()=>setTimeout(nx,180);u.onerror=()=>res();speechSynthesis.speak(u)};nx()}catch(e){res()}})}
async function speak(text,idx){const t=clean(text);if(!t)return;
if(S.cfg.tts!=='browser'&&S.cfg.prov==='gemini'&&S.cfg.key){try{return await gSpeak(t,idx,S.emps[idx])}catch(err){if(!M.warn){M.warn=1;add('meeting','Sistem','Suara Gemini gagal ('+err.message+'), sementara pakai suara browser. Cek “Model suara” di ⚙️ Pengaturan.',0,1)}}}
return bSpeak(t,idx)}

for(const e of S.emps.filter(x=>M.sel[x.id]!==false)){if(M.stop)break;M.talk=e.id;render();

M.talk=null;M.busy=0;render()}

function settings(){const c=S.cfg;$('#dlg').innerHTML=`<h3 style="margin-top:0">⚙️ Pengaturan</h3><label>Nama kamu (Bos)</label><input id=sb value="${escA(S.boss)}"><label>Provider AI</label><select id=sp>${Object.entries(PRE).map(([k,v])=>`<option value=${k} ${c.prov===k?'selected':''}>${v.n}</option>`).join('')}</select><label>API key</label><input id=sk type=password value="${escA(c.key)}" placeholder="Tempel API key di sini"><label>Model</label><input id=sm value="${escA(c.model)}"><label>Base URL (opsional, otomatis untuk provider di atas)</label><input id=su value="${escA(c.base)}" placeholder="${escA(PRE[c.prov].base||'-')}"><label>Suara meeting</label><select id=sv><option value=gemini ${c.tts!=='browser'?'selected':''}>Gemini (natural, pakai API key Gemini)</option><option value=browser ${c.tts==='browser'?'selected':''}>Suara browser (bawaan)</option></select><label>Model suara Gemini</label><input id=st value="${escA(c.ttsModel||'gemini-2.5-flash-preview-tts')}"><p class=sub id=sr>Key hanya disimpan di browser kamu dan dikirim langsung ke provider.</p><div class=row><button class=pri onclick=saveSet()>Simpan</button><button onclick=testSet()>Tes koneksi</button><button onclick="$('#dlg').close()">Tutup</button></div>`;
$('#sp').onchange=e=>{$('#sm').value=PRE[e.target.value].model;$('#su').placeholder=PRE[e.target.value].base||'-';$('#su').value=''};$('#dlg').showModal()}
function saveSet(){S.boss=$('#sb').value.trim()||'Bos';S.cfg={prov:$('#sp').value,key:$('#sk').value.trim(),model:$('#sm').value.trim(),base:$('#su').value.trim(),tts:$('#sv').value,ttsModel:$('#st').value.trim()};save();render();$('#sr').textContent='Tersimpan ✔'}
async function testSet(){saveSet();const r=$('#sr');r.textContent='Menguji…';try{const t=await llm('Balas singkat.','Balas dengan kata: OK',30);r.textContent='✔ Terhubung. Balasan: '+t}catch(e){r.textContent='✖ '+e.message}}
S.clients=S.clients||[];S.mem=S.mem||[];S.cal=S.cal||[];S.tpl=S.tpl||{...DEFTPL};speechSynthesis.onvoiceschanged=()=>{};render();if(!S.cfg.key)setTimeout(settings,400);
</script></body></html>
